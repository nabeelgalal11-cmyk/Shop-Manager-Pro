services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopos
      POSTGRES_USER: shopos
      POSTGRES_PASSWORD: shopos_dev_pw_2024
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopos"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  setup:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "apt-get update -qq && apt-get install -y --no-install-recommends python3 make g++ && npm install -g pnpm@9 && pnpm install --no-frozen-lockfile"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install -g pnpm@9 && pnpm --filter @workspace/api-server exec drizzle-kit push --config=../../lib/db/drizzle.config.ts && pnpm --filter @workspace/api-server run dev"
    environment:
      DATABASE_URL: postgres://shopos:shopos_dev_pw_2024@db:5432/shopos
      PORT: 8080
      NODE_ENV: development
      SESSION_SECRET: dev-only-insecure-secret-change-me
      PUBLIC_BASE_URL: http://localhost:3000
      SHOP_NAME: "915 Motors"
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install -g pnpm@9 && pnpm --filter @workspace/shop-os run dev"
    ports:
      - "3000:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  pgdata:
