services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    volumes:
      - ./:/app
      - pnpm_store:/root/.local/share/pnpm
    working_dir: /app
    command: bash scripts/base44-start.sh
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
    ports:
      - "3000:5173"
      - "3001:3001"
    restart: unless-stopped

volumes:
  pnpm_store:
