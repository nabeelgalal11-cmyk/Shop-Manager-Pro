        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/revenue-chart:
    get:
      operationId: getRevenueChart
      tags: [dashboard]
      summary: Get revenue chart data (last 12 months)
      responses:
        "200":
          description: Revenue chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueChartPoint"

  /dashboard/job-status-breakdown:
    get:
      operationId: getJobStatusBreakdown
      tags: [dashboard]
      summary: Get repair order status breakdown
      responses:
        "200":
          description: Job status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/top-services:
    get:
      operationId: getTopServices
      tags: [dashboard]
      summary: Get top performed services
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Top services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCount"

  # ---- USER PREFERENCES ----
  /user-preferences/boards/{boardKey}:
    get:
      operationId: getBoardPreference
      tags: [user-preferences]
      summary: Get the current user's saved board layout preference
      parameters:
        - name: boardKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Board preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPreference"
    put:
      operationId: updateBoardPreference
      tags: [user-preferences]
      summary: Save the current user's board layout preference
      parameters:
        - name: boardKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardPreferenceInput"
      responses:
        "200":
          description: Updated board preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPreference"

  /activity:
    get:
      operationId: getActivity
      tags: [activity]
      summary: Get activity timeline events for an entity
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            type: string
            enum: [repair_order, invoice, estimate, customer, vehicle, inspection, appointment]
        - name: entityId
          in: query
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: beforeId
          in: query
          description: Return events with id strictly less than this (cursor for older pages)
          schema:
            type: integer
      responses:
        "200":
          description: Activity events page (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityEventsPage"

  # ---- SQUARE ----
  /square/status:
    get:
      operationId: getSquareStatus
      tags: [square]
      summary: Get Square connection status and merchant locations
      responses:
        "200":
          description: Square connection status
          content: { application/json: { schema: { $ref: "#/components/schemas/SquareStatus" } } }
  /square/invoices/{invoiceId}/payment:
    post:
      operationId: createSquareInvoicePayment
      tags: [square]
      summary: Create a Square payment for an invoice balance
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SquareInvoicePaymentInput" } } }
      responses:
        "201":
          description: Payment created
          content: { application/json: { schema: { $ref: "#/components/schemas/SquarePaymentResult" } } }
  /square/pos/prepare:
    post:
      operationId: prepareSquarePosPayment
      tags: [square]
      summary: Prepare a signed Square Point of Sale app-switch payment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SquarePosPrepareInput" } } }
      responses:
        "200":
          description: Validated Point of Sale handoff fields
          content: { application/json: { schema: { $ref: "#/components/schemas/SquarePosPrepareResult" } } }
  /square/pos/complete:
    post:
      operationId: completeSquarePosPayment
      tags: [square]
      summary: Verify and reconcile a returned Square Point of Sale payment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SquarePosCompleteInput" } } }
      responses:
        "200":
          description: Reconciled payment
          content: { application/json: { schema: { $ref: "#/components/schemas/SquarePosCompleteResult" } } }
  /square/terminal/checkouts:
    post:
      operationId: createSquareTerminalCheckout
      tags: [square]
      summary: Create a Square Terminal checkout for an invoice
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SquareTerminalCheckoutInput" } } }
      responses:
        "201":
          description: Terminal checkout created
          content: { application/json: { schema: { $ref: "#/components/schemas/SquareTerminalCheckoutResult" } } }
  /square/terminal/checkouts/{id}:
    get:
      operationId: getSquareTerminalCheckout
      tags: [square]
      summary: Get current Square Terminal checkout status
      parameters:
        - $ref: "#/components/parameters/SquareId"
      responses:
        "200":
          description: Terminal checkout
          content: { application/json: { schema: { $ref: "#/components/schemas/SquareRemoteObject" } } }
  /square/terminal/checkouts/{id}/cancel:
    post:
      operationId: cancelSquareTerminalCheckout
      tags: [square]
      summary: Cancel a pending Square Terminal checkout
      parameters:
        - $ref: "#/components/parameters/SquareId"
      responses:
        "200":
          description: Terminal checkout cancelled
          content: { application/json: { schema: { $ref: "#/components/schemas/SquareRemoteObject" } } }
  /square/refunds:
    post:
      operationId: createSquareRefund
      tags: [square]
      summary: Refund a completed Square payment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SquareRefundInput" } } }
      responses:
        "201":
          description: Refund created
          content: { application/json: { schema: { $ref: "#/components/schemas/SquareRefundResult" } } }
  /square/sync/{resource}/preview:
    get:
      operationId: previewSquareSync
      tags: [square]
      summary: Preview conservative Square customer, catalog, or inventory synchronization
      parameters:
        - $ref: "#/components/parameters/SquareSyncResource"
      responses:
        "200":
          description: Sync preview
          content: { application/json: { schema: { $ref: "#/components/schemas/SquareSyncPreview" } } }
  /square/sync/{resource}/apply:
    post:
      operationId: applySquareSync
      tags: [square]
      summary: Record an explicit conservative Square sync application
      parameters:
        - $ref: "#/components/parameters/SquareSyncResource"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SquareSyncApplyInput" } } }
      responses:
        "200":
          description: Sync application result
          content: { application/json: { schema: { $ref: "#/components/schemas/SquareSyncApplyResult" } } }
  /square/webhook:
    post:
      operationId: receiveSquareWebhook
      tags: [square]
      summary: Receive a signature-verified Square webhook
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SquareWebhookEvent" } } }
      responses:
        "200": { description: Webhook accepted }

components:
  parameters:
    RepairOrderId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: integer }
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: { type: integer }
    InvoiceId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    SquareId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    SquareSyncResource:
      name: resource
      in: path
      required: true
      schema: { type: string, enum: [customers, catalog, inventory] }
  responses:
    NotFoundError:
      description: Requested resource was not found
      content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowError" } } }
    WorkflowConflict:
      description: The requested state transition is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowError" } } }
  schemas:
    AuthUser:
      type: object
      required: [id, username, firstName, lastName, role, roles, active]
      properties:
        id: { type: integer }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: [string, "null"] }
        role: { type: string }
        roles: { type: array, items: { type: string } }
        active: { type: boolean }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        mobile: { type: boolean, default: false }
    ForgotPasswordInput:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254, description: Username or email address }
    ForgotPasswordResponse:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean, example: true }
        message: { type: string }
    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 6 }
    ResetPasswordResponse:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    MobileLoginResponse:
      type: object
      required: [user, permissions]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        permissions: { type: array, items: { type: string } }
        mobileToken: { type: string }
        mobileTokenExpiresAt: { type: string, format: date-time }
    CurrentUserResponse:
      type: object
      required: [user, permissions]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        permissions: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        actions: { type: array, items: { type: string } }
    HealthStatus:
      type: object
      properties:
        status:
