openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ShopOS Auto Repair Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Session and mobile bearer authentication
  - name: health
    description: Health operations
  - name: customers
    description: Customer management
  - name: vehicles
    description: Vehicle management
  - name: estimates
    description: Estimate management
  - name: invoices
    description: Invoice management
  - name: repair-orders
    description: Repair orders and job cards
  - name: inventory
    description: Parts and inventory
  - name: inspections
    description: Vehicle inspections
  - name: appointments
    description: Scheduling and appointments
  - name: payments
    description: Payment tracking
  - name: employees
    description: Employee management
  - name: time-entries
    description: Time tracking
  - name: expenses
    description: Expense tracking
  - name: dashboard
    description: Dashboard analytics
  - name: reminders
    description: Service reminders
  - name: used-cars
    description: Used-car inventory
  - name: reports
    description: Business reports
  - name: user-preferences
    description: Per-user UI preferences
  - name: activity
    description: Per-entity activity timeline
  - name: suppliers
    description: Parts suppliers / vendors
  - name: exports
    description: CSV / ZIP exports for bookkeeping (QuickBooks Online)
  - name: square
    description: Square payment, Terminal, refund, and conservative synchronization operations

paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with optional mobile bearer token issuance
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileLoginResponse"
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request that staff manually reset a password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic confirmation (does not disclose account existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
  /auth/reset-password:
    post:
      operationId: submitPasswordReset
      tags: [auth]
      summary: Reset a password using a one-time email token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"

  # ---- EXPORTS / BOOKKEEPING ----
  /exports/invoices.csv:
    get:
      operationId: exportInvoicesCsv
      tags: [exports]
      summary: Download invoices as CSV (QuickBooks-friendly)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /exports/payments.csv:
    get:
      operationId: exportPaymentsCsv
      tags: [exports]
      summary: Download successful payments as CSV
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /exports/expenses.csv:
    get:
      operationId: exportExpensesCsv
      tags: [exports]
      summary: Download expenses as CSV
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /exports/cogs-journal.csv:
    get:
      operationId: exportCogsJournalCsv
      tags: [exports]
      summary: Download daily COGS journal entries as CSV
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV file (Date, Account, Debit, Credit, Memo)
          content:
            text/csv:
              schema: { type: string }
  /exports/bookkeeping.zip:
    get:
      operationId: exportBookkeepingZip
      tags: [exports]
      summary: Download all bookkeeping CSVs bundled in a single ZIP
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: ZIP archive containing invoices, payments, expenses, and COGS journal CSVs
          content:
            application/zip:
              schema: { type: string, format: binary }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---- CUSTOMERS ----
  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerInput"
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /customers/{id}/vehicles:
    get:
      operationId: getCustomerVehicles
      tags: [customers]
      summary: Get vehicles for a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /customers/{id}/statement:
    get:
      operationId: getCustomerStatement
      tags: [customers]
      summary: Get billing statement for customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer billing statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerStatement"

  # ---- VEHICLES ----
  /vehicles:
    get:
      operationId: getVehicles
      tags: [vehicles]
      summary: List vehicles
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleListResponse"
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleInput"
      responses:
        "201":
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
    put:
      operationId: updateVehicle
      tags: [vehicles]
      summary: Update vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleInput"
      responses:
        "200":
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Delete vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vehicles/{id}/warranties:
    get:
      operationId: getVehicleWarranties
      tags: [vehicles]
      summary: Get active warranties for a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active warranties for the vehicle.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleWarrantyEntry"

  /vehicles/{id}/service-history:
    get:
      operationId: getVehicleServiceHistory
      tags: [vehicles]
      summary: Get vehicle service history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceHistoryEntry"

  # ---- ESTIMATES / REPAIR WORKFLOW ----
  /estimates:
    get:
      operationId: getEstimates
      tags: [estimates]
      summary: List estimates
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, sent, approved, declined, denied, converted]
        - name: customerId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of estimates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EstimateRevision" }
    post:
      operationId: createEstimate
      tags: [estimates]
      summary: Create an estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEstimateInput"
      responses:
        "201":
          description: Estimate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"

  /estimates/{id}:
    get:
      operationId: getEstimate
      tags: [estimates]
      summary: Get estimate by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Estimate details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateRevisionDetail"
    put:
      operationId: updateEstimate
      tags: [estimates]
      summary: Update estimate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEstimateInput"
      responses:
        "200":
          description: Estimate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
    delete:
      operationId: deleteEstimate
      tags: [estimates]
      summary: Delete estimate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /estimates/{id}/convert:
    post:
      operationId: convertEstimateToInvoice
      tags: [estimates]
      summary: Convert estimate to invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Invoice created from estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /estimates/{id}/convert-to-ro:
    post:
      operationId: convertEstimateToRepairOrder
      tags: [estimates]
      summary: Convert approved estimate lines into a Repair Order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Repair order created from approved estimate lines
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ---- INVOICES ----
  /invoices:
    get:
      operationId: getInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, sent, paid, overdue, void]
        - name: customerId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowInvoice" }
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceInput"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInvoiceDetail"
    put:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceInput"
      responses:
        "200":
          description: Invoice updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ---- REPAIR ORDERS ----
  /repair-orders:
    get:
      operationId: getRepairOrders
      tags: [repair-orders]
      summary: List repair orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, waiting_parts, awaiting_approval, completed, delivered, cancelled]
        - name: assignedTo
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of repair orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowRepairOrder" }
    post:
      operationId: createRepairOrder
      tags: [repair-orders]
      summary: Create a repair order
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/RepairOrderInput"
      responses:
        "201":
          description: Repair order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRepairOrder"

  /repair-orders/{id}:
    get:
      operationId: getRepairOrder
      tags: [repair-orders]
      summary: Get repair order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Repair order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairOrderWorkflow"
    put:
      operationId: updateRepairOrder
      tags: [repair-orders]
      summary: Update repair order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepairOrderInput"
      responses:
        "200":
          description: Repair order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairOrder"
    delete:
      operationId: deleteRepairOrder
      tags: [repair-orders]
      summary: Delete repair order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /repair-orders/{id}/intake:
    patch:
      operationId: updateRepairOrderIntake
      tags: [repair-orders]
      summary: Edit repair-order intake fields with optimistic concurrency
      parameters:
        - $ref: "#/components/parameters/RepairOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairOrderIntakeUpdate" }
      responses:
        "200": { description: Updated repair order, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRepairOrder" } } } }
        "409": { $ref: "#/components/responses/WorkflowConflict" }

  /repair-orders/{id}/revisions:
    post:
      operationId: createRepairOrderRevision
      tags: [repair-orders, estimates]
      summary: Create a draft estimate or supplement revision
      parameters:
        - $ref: "#/components/parameters/RepairOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateRevisionCreateInput" }
      responses:
        "201": { description: Draft revision, content: { application/json: { schema: { $ref: "#/components/schemas/EstimateRevision" } } } }
        "409": { $ref: "#/components/responses/WorkflowConflict" }

  /repair-orders/revisions/{revisionId}/items:
    put:
      operationId: replaceEstimateRevisionDraftItems
      tags: [repair-orders, estimates]
      summary: Replace every item on a draft revision
      parameters:
        - $ref: "#/components/parameters/RevisionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateRevisionItemsUpdate" }
      responses:
        "200": { description: Updated revision, content: { application/json: { schema: { $ref: "#/components/schemas/EstimateRevision" } } } }

  /repair-orders/revisions/{revisionId}/send:
    post:
      operationId: sendEstimateRevision
      tags: [repair-orders, estimates]
      summary: Send a draft revision for customer decision
      parameters:
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200": { description: Sent revision, content: { application/json: { schema: { $ref: "#/components/schemas/EstimateRevision" } } } }

  /repair-orders/work-items/{workItemId}/perform:
    post:
      operationId: performRepairOrderWorkItem
      tags: [repair-orders]
      summary: Mark an authorized work item performed
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
      responses:
        "200": { description: Performed work item, content: { application/json: { schema: { $ref: "#/components/schemas/RepairOrderWorkItem" } } } }

  /repair-orders/{id}/complete:
    post:
      operationId: completeRepairOrderWorkflow
      tags: [repair-orders]
      summary: Complete a repair order after authorized work is performed
      parameters:
        - $ref: "#/components/parameters/RepairOrderId"
      responses:
        "200": { description: Completed repair order, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRepairOrder" } } } }

  /repair-orders/{id}/cancel:
    post:
      operationId: cancelRepairOrderWorkflow
      tags: [repair-orders]
      summary: Cancel a repair order
      parameters:
        - $ref: "#/components/parameters/RepairOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "200": { description: Cancelled repair order, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRepairOrder" } } } }

  /repair-orders/{id}/invoice:
    post:
      operationId: createRepairOrderFinalInvoice
      tags: [repair-orders, invoices]
      summary: Create the immutable final invoice for a completed repair order
      parameters:
        - $ref: "#/components/parameters/RepairOrderId"
      responses:
        "201": { description: Draft invoice, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowInvoice" } } } }

  /public/estimates/{token}:
    get:
      operationId: getPublicEstimateRevision
      tags: [estimates]
      security: []
      summary: Get a sent estimate revision through its unguessable token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Token-scoped revision, content: { application/json: { schema: { $ref: "#/components/schemas/PublicEstimateRevision" } } } }
        "404": { $ref: "#/components/responses/NotFoundError" }

  /public/estimates/{token}/decision:
    post:
      operationId: decidePublicEstimateRevision
      tags: [estimates]
      security: []
      summary: Submit the customer's complete item decision for a sent revision
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateDecisionInput" }
      responses:
        "200": { description: Recorded approval, content: { application/json: { schema: { $ref: "#/components/schemas/EstimateDecisionResult" } } } }
        "409": { $ref: "#/components/responses/WorkflowConflict" }

  /public/invoices/{token}:
    get:
      operationId: getPublicWorkflowInvoice
      tags: [invoices]
      security: []
      summary: Get an issued invoice through its bearer payment token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
