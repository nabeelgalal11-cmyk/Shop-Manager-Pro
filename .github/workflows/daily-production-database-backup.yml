name: Daily production database backup

on:
  schedule:
    # GitHub runs scheduled workflows in UTC; avoid the busy top of the hour.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require a private repository
        env:
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
        run: |
          if [ "$REPOSITORY_VISIBILITY" != "private" ]; then
            echo "This backup workflow requires a private GitHub repository." >&2
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create and upload the verified backup
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_UPLOAD_TOKEN: ${{ secrets.BACKUP_UPLOAD_TOKEN }}
          BACKUP_UPLOAD_URL: https://shop-manager-pro.replit.app/api/backups/upload
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --env DATABASE_URL \
            --env BACKUP_UPLOAD_TOKEN \
            --env BACKUP_UPLOAD_URL \
            --entrypoint /bin/sh \
            postgres:16-alpine \
            -c 'apk add --no-cache curl >/dev/null && /bin/sh /workspace/scripts/database-backup/run-backup.sh'